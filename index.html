<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efsane Emlak - Gayrimenkul & Danışmanlık</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-gray-950/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-amber-500 tracking-wide">EFSANE EMLAK</h1>
      <nav class="space-x-4">
        <a href="#listings" class="text-gray-300 hover:text-amber-500 transition">İlanlar</a>
        <a href="/admin" class="bg-amber-500 text-gray-950 font-semibold px-4 py-2 rounded-lg hover:bg-amber-400 transition">Yönetim Paneli</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="py-12 text-center bg-gradient-to-b from-gray-950 to-gray-900 border-b border-gray-800">
    <h2 class="text-4xl font-extrabold text-white mb-3">Hayalinizdeki Gayrimenkulü Bulun</h2>
    <p class="text-gray-400 text-lg max-w-xl mx-auto">Eskişehir ve çevresindeki en güncel satılık ve kiralık ilanlar.</p>
  </section>

  <!-- Listings -->
  <main id="listings" class="max-w-7xl mx-auto px-4 py-12 flex-grow w-full">
    <h3 class="text-2xl font-bold text-white mb-8 border-l-4 border-amber-500 pl-3">Tüm İlanlar</h3>
    
    <div id="loading" class="text-center text-gray-400 py-12">İlanlar yükleniyor...</div>
    <div id="empty" class="hidden text-center text-gray-500 py-12">Henüz eklenmiş bir ilan bulunmuyor.</div>

    <div id="listings-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </main>

  <!-- Modal / Detail Popup -->
  <div id="detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto relative p-6 shadow-2xl">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-800 hover:bg-gray-700 w-10 h-10 rounded-full flex items-center justify-center z-20 text-xl font-bold transition">
        ✕
      </button>

      <!-- Navigation Arrows -->
      <button onclick="navigateModal(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-gray-800/80 hover:bg-amber-500 text-white hover:text-gray-950 w-10 h-10 rounded-full flex items-center justify-center z-20 text-xl font-bold transition">
        ❮
      </button>
      <button onclick="navigateModal(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-gray-800/80 hover:bg-amber-500 text-white hover:text-gray-950 w-10 h-10 rounded-full flex items-center justify-center z-20 text-xl font-bold transition">
        ❯
      </button>

      <!-- Modal Content -->
      <div id="modal-content" class="space-y-6"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-gray-800 bg-gray-950 py-6 text-center text-gray-500 text-sm">
    <p>&copy; 2026 Efsane Emlak. Tüm hakları saklıdır.</p>
  </footer>

  <script>
    let allListings = [];
    let currentModalIndex = 0;

    function parseFrontmatter(text) {
      const match = text.match(/^---\r?\n([\s\S]+?)\r?\n---/);
      if (!match) return {};
      const yaml = match[1];
      const data = {};
      
      const titleMatch = yaml.match(/title:\s*"?([^"\r\n]+)"?/);
      const priceMatch = yaml.match(/price:\s*"?([^"\r\n]+)"?/);
      const categoryMatch = yaml.match(/category:\s*"?([^"\r\n]+)"?/);
      const locationMatch = yaml.match(/location:\s*"?([^"\r\n]+)"?/);
      const mapLinkMatch = yaml.match(/map_link:\s*"?([^"\r\n]+)"?/);
      const descMatch = yaml.match(/description:\s*"?([\s\S]+?)"?(?=\n\w+:|$)/);

      if (titleMatch) data.title = titleMatch[1];
      if (priceMatch) data.price = priceMatch[1];
      if (categoryMatch) data.category = categoryMatch[1];
      if (locationMatch) data.location = locationMatch[1];
      if (mapLinkMatch) data.map_link = mapLinkMatch[1];
      if (descMatch) data.description = descMatch[1].trim();

      // Extract image list
      data.images = [];
      const imageRegex = /-\s*"?([^"\r\n]+\.(?:png|jpg|jpeg|webp))"?/gi;
      let imgMatch;
      while ((imgMatch = imageRegex.exec(yaml)) !== null) {
        data.images.push(imgMatch[1]);
      }
      
      // Fallback single image check
      if (data.images.length === 0) {
        const singleImgMatch = yaml.match(/image:\s*"?([^"\r\n]+)"?/);
        if (singleImgMatch) data.images.push(singleImgMatch[1]);
      }

      return data;
    }

    async function fetchListings() {
      const container = document.getElementById('listings-grid');
      const loading = document.getElementById('loading');
      const empty = document.getElementById('empty');

      try {
        const response = await fetch('https://api.github.com/repos/efsaneemlaksite/efsane-emlak2/contents/content/listings');
        if (!response.ok) throw new Error('İlanlar çekilemedi');

        const files = await response.json();
        const mdFiles = files.filter(f => f.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          loading.classList.add('hidden');
          empty.classList.remove('hidden');
          return;
        }

        allListings = [];

        for (const file of mdFiles) {
          const res = await fetch(file.download_url);
          const text = await res.text();
          const item = parseFrontmatter(text);
          allListings.push(item);
        }

        loading.classList.add('hidden');
        renderGrid();

      } catch (err) {
        console.error(err);
        loading.classList.add('hidden');
        empty.classList.remove('hidden');
      }
    }

    function renderGrid() {
      const container = document.getElementById('listings-grid');
      container.innerHTML = '';

      allListings.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "bg-gray-800 border border-gray-700/60 rounded-xl overflow-hidden shadow-lg flex flex-col justify-between hover:border-amber-500/50 transition";
        
        const images = item.images.length > 0 ? item.images : ['https://via.placeholder.com/400x300?text=Görsel+Yok'];
        
        let sliderHTML = `
          <div class="relative h-52 w-full overflow-hidden bg-gray-950 group">
            <div id="card-slider-${index}" class="flex h-full transition-transform duration-300">
              ${images.map(img => `<img src="${img}" class="w-full h-full object-cover flex-shrink-0">`).join('')}
            </div>
            ${images.length > 1 ? `
              <button onclick="moveCardSlider(${index}, -1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black text-white p-1 rounded-full text-xs opacity-0 group-hover:opacity-100 transition">❮</button>
              <button onclick="moveCardSlider(${index}, 1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black text-white p-1 rounded-full text-xs opacity-0 group-hover:opacity-100 transition">❯</button>
            ` : ''}
            <span class="absolute top-3 left-3 bg-amber-500 text-gray-950 font-bold text-xs px-2.5 py-1 rounded-md uppercase">
              ${item.category || 'Satılık'}
            </span>
          </div>
        `;

        card.innerHTML = `
          ${sliderHTML}
          <div class="p-5 flex-grow flex flex-col justify-between">
            <div>
              <h4 class="text-xl font-bold text-white mb-1">${item.title || 'İlan Başlığı'}</h4>
              <p class="text-xs text-amber-500 mb-3">📍 ${item.location || 'Eskişehir'}</p>
              <p class="text-sm text-gray-300 line-clamp-2 mb-4">${item.description || 'Açıklama belirtilmedi.'}</p>
            </div>
            
            <div>
              <div class="text-xl font-extrabold text-amber-400 mb-4">${item.price ? item.price + ' TL' : ''}</div>
              
              <div class="flex gap-2">
                <button onclick="openModal(${index})" class="flex-1 bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold py-2 px-3 rounded-lg text-sm text-center transition">
                  Detaylar
                </button>
                ${item.map_link ? `
                  <a href="${item.map_link}" target="_blank" class="bg-gray-700 hover:bg-gray-600 text-white font-medium py-2 px-3 rounded-lg text-sm text-center flex items-center justify-center transition">
                    🗺️ Harita
                  </a>
                ` : ''}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Card Slider Engine
    const sliderIndices = {};
    function moveCardSlider(cardIndex, direction) {
      if (!sliderIndices[cardIndex]) sliderIndices[cardIndex] = 0;
      const imagesCount = allListings[cardIndex].images.length;
      sliderIndices[cardIndex] = (sliderIndices[cardIndex] + direction + imagesCount) % imagesCount;
      
      const sliderEl = document.getElementById(`card-slider-${cardIndex}`);
      sliderEl.style.transform = `translateX(-${sliderIndices[cardIndex] * 100}%)`;
    }

    // Modal Engine
    let modalImageIndex = 0;
    function openModal(index) {
      currentModalIndex = index;
      modalImageIndex = 0;
      renderModalContent();
      document.getElementById('detail-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function navigateModal(direction) {
      currentModalIndex = (currentModalIndex + direction + allListings.length) % allListings.length;
      modalImageIndex = 0;
      renderModalContent();
    }

    function renderModalContent() {
      const item = allListings[currentModalIndex];
      const images = item.images.length > 0 ? item.images : ['https://via.placeholder.com/600x400?text=Görsel+Yok'];
      const modalEl = document.getElementById('modal-content');

      modalEl.innerHTML = `
        <!-- Modal Image Slider -->
        <div class="relative h-72 sm:h-96 w-full rounded-xl overflow-hidden bg-gray-950 group">
          <img src="${images[modalImageIndex]}" class="w-full h-full object-cover">
          ${images.length > 1 ? `
            <button onclick="changeModalImage(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-black text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">❮</button>
            <button onclick="changeModalImage(1)" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-black text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">❯</button>
            <div class="absolute bottom-3 right-3 bg-black/70 text-xs text-white px-2.5 py-1 rounded-full">
              ${modalImageIndex + 1} / ${images.length}
            </div>
          ` : ''}
        </div>

        <!-- Info -->
        <div>
          <div class="flex justify-between items-start gap-4 mb-2">
            <div>
              <span class="inline-block bg-amber-500 text-gray-950 text-xs font-bold px-2 py-0.5 rounded mb-2">${item.category || 'Satılık'}</span>
              <h3 class="text-2xl font-extrabold text-white">${item.title || 'İlan Başlığı'}</h3>
              <p class="text-amber-500 text-sm mt-1">📍 ${item.location || 'Eskişehir'}</p>
            </div>
            <div class="text-2xl font-black text-amber-400 whitespace-nowrap">${item.price ? item.price + ' TL' : ''}</div>
          </div>

          <hr class="border-gray-800 my-4">

          <div>
            <h5 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">İlan Açıklaması</h5>
            <p class="text-gray-200 leading-relaxed whitespace-pre-line text-sm">${item.description || 'Açıklama girilmemiş.'}</p>
          </div>

          ${item.map_link ? `
            <div class="mt-6">
              <a href="${item.map_link}" target="_blank" class="inline-flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-white font-semibold py-2.5 px-5 rounded-xl text-sm border border-gray-700 transition">
                🗺️ Google Maps Konumuna Git
              </a>
            </div>
          ` : ''}
        </div>
      `;
    }

    function changeModalImage(direction) {
      const images = allListings[currentModalIndex].images;
      modalImageIndex = (modalImageIndex + direction + images.length) % images.length;
      renderModalContent();
    }

    document.addEventListener('DOMContentLoaded', fetchListings);
  </script>
</body>
</html>
