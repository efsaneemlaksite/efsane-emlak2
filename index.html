<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efsane Emlak - Gayrimenkul & Danışmanlık</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Decap CMS Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Markdown Frontmatter Parser (js-yaml) -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header / Navigation -->
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-blue-600">Efsane Emlak</h1>
      <nav class="space-x-4">
        <a href="#listings" class="text-gray-600 hover:text-blue-600">İlanlar</a>
        <a href="/admin" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Yönetim Paneli</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-blue-600 text-white py-16 text-center">
    <h2 class="text-4xl font-extrabold mb-4">Hayalinizdeki Evi Bulun</h2>
    <p class="text-lg text-blue-100">En güncel gayrimenkul ve emlak fırsatları Efsane Emlak'ta.</p>
  </section>

  <!-- Listings Section -->
  <section id="listings" class="max-w-7xl mx-auto px-4 py-12">
    <h3 class="text-3xl font-bold text-gray-900 mb-8 text-center">Tüm İlanlar</h3>
    
    <!-- Loading State -->
    <div id="loading" class="text-center text-gray-500 py-8">İlanlar yükleniyor...</div>
    
    <!-- Empty State -->
    <div id="empty" class="hidden text-center text-gray-500 py-8">Henüz eklenmiş bir ilan bulunmuyor.</div>

    <!-- Listings Grid -->
    <div id="listings-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white py-8 text-center mt-12">
    <p>&copy; 2026 Efsane Emlak. Tüm hakları saklıdır.</p>
  </footer>

  <!-- Script to Fetch and Render MD Listings -->
  <script>
    function parseFrontmatter(text) {
      const match = text.match(/^---\r?\n([\s\S]+?)\r?\n---/);
      if (match) {
        try {
          return jsyaml.load(match[1]);
        } catch (e) {
          console.error("YAML parse hatası:", e);
        }
      }
      return {};
    }

    async function loadListings() {
      const grid = document.getElementById('listings-grid');
      const loading = document.getElementById('loading');
      const empty = document.getElementById('empty');

      try {
        const response = await fetch('https://api.github.com/repos/Fatih14531453/efsane-emlak/contents/content/listings');
        
        if (!response.ok) {
          loading.classList.add('hidden');
          empty.classList.remove('hidden');
          return;
        }

        const files = await response.json();
        const mdFiles = files.filter(file => file.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          loading.classList.add('hidden');
          empty.classList.remove('hidden');
          return;
        }

        loading.classList.add('hidden');

        for (const file of mdFiles) {
          const res = await fetch(file.download_url);
          const rawText = await res.text();
          const item = parseFrontmatter(rawText);

          const card = document.createElement('div');
          card.className = "bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow";
          card.innerHTML = `
            <img src="${item.image || 'https://via.placeholder.com/400x250?text=Emlak+Gorseli'}" alt="${item.title || 'İlan'}" class="w-full h-48 object-cover">
            <div class="p-6">
              <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded font-semibold mb-2">${item.category || 'Satılık'}</span>
              <h4 class="text-xl font-bold text-gray-900 mb-2">${item.title || 'İlan Başlığı'}</h4>
              <p class="text-gray-500 text-sm mb-4">📍 ${item.location || 'Konum Belirtilmedi'}</p>
              <div class="flex justify-between items-center mt-4">
                <span class="text-2xl font-bold text-blue-600">${item.price ? item.price + ' TL' : 'Fiyat Belirtilmedi'}</span>
                <a href="${item.link || '#'}" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Detaylar</a>
              </div>
            </div>
          `;
          grid.appendChild(card);
        }
      } catch (err) {
        console.error('İlanlar yüklenirken hata oluştu:', err);
        loading.classList.add('hidden');
        empty.classList.remove('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', loadListings);
  </script>

  <!-- Netlify Identity Redirect Script -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
